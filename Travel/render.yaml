services:
  # Backend API on Render
  - type: web
    name: travelsphere-backend
    env: node
    region: oregon
    plan: starter
    rootDir: backend
    buildCommand: npm install && npm run build
    startCommand: node dist/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: CLIENT_URL
        value: https://travelsphere.vercel.app
      - key: DATABASE_URL
        fromDatabase:
          name: travelsphere-db
          property: connectionString
      - key: JWT_ACCESS_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: JWT_ACCESS_EXPIRY
        value: 15m
      - key: JWT_REFRESH_EXPIRY
        value: 7d

databases:
  # Managed PostgreSQL on Render
  - name: travelsphere-db
    region: oregon
    plan: starter
    databaseName: travelsphere
    user: postgres
